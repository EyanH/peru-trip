  // Parse lat/lon from a Google Maps URL
  function parseMapsUrl(url){
    if(!url)return null;
    var m;
    // !3dlat!4dlon — actual place pin, highest priority
    m=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lon:parseFloat(m[2])};
    // q=lat,lon
    m=url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lon:parseFloat(m[2])};
    // ll=lat,lon
    m=url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lon:parseFloat(m[2])};
    // @lat,lon — map viewport center, last resort
    m=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m)return{lat:parseFloat(m[1]),lon:parseFloat(m[2])};
    return null;

            });

            // Step 4: accent-stripped broader search

              +"&format=json&limit=10&addressdetails=1&countrycodes=pe")
